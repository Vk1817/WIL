<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fox Cricket</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="referrer" content="no-referrer"/>

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Plyr JS -->
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .plyr {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div class="video-container">
  <video
    id="player"
    controls
    autoplay
    muted
    playsinline
    preload="metadata">
  </video>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("player");

    const source =
    "https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8";

    const defaultOptions = {
        autoplay: true,
        controls: [
            "play",
            "rewind",
            "fast-forward",
            "progress",
            "current-time",
            "mute",
            "volume",
            "settings",
            "fullscreen"
        ],
        settings: ["quality"]
    };

    let player;

    function setupPlayer(hls, qualities = []) {

        player = new Plyr(video, {
            ...defaultOptions,

            ...(qualities.length
                ? {
                    quality: {
                        default: qualities[0],
                        options: qualities,
                        forced: true,
                        onChange: quality => {
                            hls.levels.forEach((level, index) => {
                                if (level.height === quality) {
                                    hls.currentLevel = index;
                                }
                            });
                        }
                    }
                }
                : {})
        });

        // Auto Resume
        setInterval(() => {
            if (video.paused && video.readyState > 2) {
                video.play().catch(() => {});
            }
        }, 3000);

        // Auto Unmute after first interaction
        const unmute = () => {
            video.muted = false;
            video.volume = 1;

            document.removeEventListener("click", unmute);
            document.removeEventListener("touchstart", unmute);
        };

        document.addEventListener("click", unmute);
        document.addEventListener("touchstart", unmute);
    }

    if (Hls.isSupported()) {

        const hls = new Hls({
            autoStartLoad: true
        });

        hls.loadSource(source);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {

            const qualities = data.levels
                .map(level => level.height)
                .sort((a, b) => b - a);

            video.play().catch(() => {});
            setupPlayer(hls, qualities);

        });

        hls.on(Hls.Events.ERROR, (_, data) => {

            if (data.fatal) {

                switch (data.type) {

                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;

                    default:
                        hls.destroy();
                        break;
                }
            }

        });

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = source;

        video.addEventListener("loadedmetadata", () => {
            video.play().catch(() => {});
            setupPlayer(null);
        });

    }

});
</script>

</body>
</html>
