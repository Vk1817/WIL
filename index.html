      height: 6px;
      border-radius: 50%;
      background: #00e5ff;
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;

    .watermark-text {

      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }

  <script>  
    document.addEventListener('DOMContentLoaded', async () => {  
      shaka.polyfill.installAll();  
      if (!shaka.Player.isBrowserSupported()) { console.error('Browser not supported'); return; }  
      const video = document.querySelector('video');  
      const player = new shaka.Player();  
      await player.attach(video);  
      const container = document.querySelector('.shaka-video-container');  
      const ui = new shaka.ui.Overlay(player, container, video);  
      ui.configure({  
        controlPanelElements: ['play_pause','time_and_duration','mute','volume','spacer','language','captions','picture_in_picture','quality','fullscreen'],  
        volumeBarColors: { base: 'rgba(255, 192, 203, 0.3)', level: 'rgb(255, 105, 180)' },  
        seekBarColors: { base: 'rgba(255, 255, 0, 0.3)', buffered: 'rgba(255, 255, 0, 0.6)', played: 'rgb(255, 255, 0)' }  
      });  
      player.configure({  
        drm: { clearKeys: { "56816fa6c2b3fa65a5de766d52f08b7f": "07c1b41782e4321883a06b73629200a0" } },  
        streaming: { lowLatencyMode: true, bufferingGoal: 10, rebufferingGoal: 2, retryParameters: { timeout: 10000, maxAttempts: 5 } }  
      });  
      player.addEventListener('error', (e) => console.error('Shaka Error:', e.detail));  
      try {  
        await player.load("https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/kr46ndje4l/out/v1/9833c1deedb64791b99615a4aefefb66/cenc.mpd");  
        console.log("Stream loaded successfully");  
      } catch (e) { console.error('Load error:', e); }  
    });
